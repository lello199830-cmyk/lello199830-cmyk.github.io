<style>
:root{--petrolio:#237C83;--petrolio-scuro:#1b6268;--inchiostro:#20343F;--menta:#F0F7F5;--fondo:#E9F3F0;--grigio:#56676f}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;min-height:100dvh;padding:1.25rem;
  display:flex;justify-content:center;align-items:flex-start;
  background:var(--fondo);color:var(--inchiostro);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.4;
}
a{text-decoration:none;color:inherit}
.scheda{
  width:100%;max-width:26rem;background:#fff;border-radius:1.75rem;overflow:hidden;
  box-shadow:0 18px 40px -18px rgba(32,52,63,.35);
}
.fascia{background:var(--petrolio);height:7.5rem;border-radius:0 0 50% 50%/0 0 2.2rem 2.2rem}
.sigla{
  width:6.5rem;height:6.5rem;border-radius:50%;margin:-3.25rem auto 0;
  display:grid;place-items:center;background:var(--inchiostro);color:#fff;border:5px solid #fff;
  font-size:2rem;font-weight:800;letter-spacing:.02em;
}
h1{margin:.9rem 1rem .15rem;text-align:center;font-size:1.7rem;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.ruolo{margin:0 0 1.3rem;text-align:center;color:var(--petrolio);font-weight:600}
.canali{padding:0 1.1rem 1.2rem;display:grid;gap:.65rem}
.canale{
  display:flex;align-items:center;gap:.9rem;padding:.8rem .9rem;border-radius:1rem;
  background:var(--menta);transition:background-color .15s,transform .15s;
}
.canale:hover{background:#e2efeb}
.canale:active{transform:scale(.985)}
.icona{width:2.7rem;height:2.7rem;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--petrolio);color:#fff}
.icona svg{width:1.35rem;height:1.35rem;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nome{display:block;font-size:1.05rem;font-weight:700}
.valore{display:block;font-size:.84rem;color:var(--grigio)}
.canale--primo{background:var(--petrolio);color:#fff}
.canale--primo:hover{background:var(--petrolio-scuro)}
.canale--primo .icona{background:#fff;color:var(--petrolio)}
.canale--primo .valore{color:#dcefef;font-size:.95rem}
.rubrica{
  display:block;margin:0 1.1rem 1.4rem;padding:.85rem;text-align:center;border-radius:1rem;
  border:1.5px solid var(--petrolio);color:var(--petrolio);font-weight:700;transition:background-color .15s,color .15s;
}
.rubrica:hover{background:var(--petrolio);color:#fff}
a:focus-visible{outline:3px solid var(--inchiostro);outline-offset:3px}
@media (min-width:40rem){body{align-items:center}}
@media (prefers-reduced-motion:reduce){.canale,.rubrica{transition:none}.canale:active{transform:none}}
</style>
</head>
